name: Java CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x cloud-performance-api/mvnw

      - name: Run tests
        working-directory: cloud-performance-api
        run: ./mvnw test

      - name: Build application
        working-directory: cloud-performance-api
        run: ./mvnw clean package
